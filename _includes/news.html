{% assign news = site.data.news %}
{% assign visible = 5 %}
{% if news.size > 0 %}
<h2 class="block-title"><i class="fa-regular fa-newspaper"></i> News</h2>
<ul class="news" id="news-list">
  {% for n in news %}
  <li {% if forloop.index > visible %}class="news-extra"{% endif %}>
    <span class="date">{{ n.date }}</span>
    <span class="news-text">{{ n.text }}</span>
  </li>
  {% endfor %}
</ul>
{% if news.size > visible %}
<button class="btn btn-outline news-toggle" type="button" aria-expanded="false" aria-controls="news-list">
  <span>Show all</span> <i class="fa-solid fa-chevron-down"></i>
</button>
{% endif %}
{% endif %}
